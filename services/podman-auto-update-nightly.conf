# Drop-in per il timer UTENTE podman-auto-update (utente core).
# Installato in ~/.config/systemd/user/podman-auto-update.timer.d/
#
# Il timer utente aggiorna solo i container ROOTLESS con AutoUpdate=registry,
# cioè solo cloudflared. Home Assistant è rootful e resta fuori: si aggiorna
# a mano con scripts/update_ha.sh.

[Timer]
# Azzera 'daily' del timer di default e fissa l'esecuzione alle 04:00 ora
# italiana (l'host gira in UTC).
OnCalendar=
OnCalendar=*-*-* 04:00:00 Europe/Rome
RandomizedDelaySec=15min
# Se il server era spento alle 4, non recuperare il controllo al boot in pieno
# giorno: si aspetta la notte successiva.
Persistent=false
