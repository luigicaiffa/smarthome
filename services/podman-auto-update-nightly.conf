# Drop-in per il timer UTENTE podman-auto-update dell'utente cloudflared.
# Installato in /var/home/cloudflared/.config/systemd/user/podman-auto-update.timer.d/
#
# Il timer di un utente aggiorna solo i suoi container con AutoUpdate=registry,
# cioè solo cloudflared. Home Assistant ha il suo utente, senza timer e senza
# AutoUpdate: si aggiorna a mano con scripts/update_ha.sh.

[Timer]
# Azzera 'daily' del timer di default e fissa l'esecuzione alle 04:00 ora
# italiana (l'host gira in UTC).
OnCalendar=
OnCalendar=*-*-* 04:00:00 Europe/Rome
RandomizedDelaySec=15min
# Se il server era spento alle 4, non recuperare il controllo al boot in pieno
# giorno: si aspetta la notte successiva.
Persistent=false
