# Installato in /etc/systemd/resolved.conf.d/90-no-llmnr.conf
#
# LLMNR risponde in LAN (porta 5355) alle richieste di risoluzione dei nomi
# brevi. Non serve a nulla su un server con DNS e mDNS, ed e' un classico
# appiglio per avvelenare la risoluzione dei nomi da un altro host della rete.
[Resolve]
LLMNR=no
